# BetterLoop host MCP fallback.
#
# This is project-scoped and only loads when the project is trusted by Codex.
# The server is dormant until the user presses BetterLoop ON in the visible
# page. It is intentionally not added to the user's global Codex config.
[mcp_servers.betterloop]
command = "node"
args = ["scripts/betterloop-mcp.cjs"]
cwd = "."
enabled = true
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "prompt"
